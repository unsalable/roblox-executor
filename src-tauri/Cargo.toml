[package]
name = "nova"
# The user-facing version comes from ../package.json through tauri.conf.json.
version = "0.1.0"
description = "Nova development environment"
license = "MIT"
repository = "https://github.com/unsalable/roblox-executor"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "nova_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# The local developer service's wire protocol is raw JSON text, so the size,
# malformed-message and protocol-version checks are the service's own rather
# than serde's: `serde_json` is what reads it. `getrandom` is the operating
# system's randomness, and the only thing a session token is made of — there is
# no std API for it and a weaker source is not an option. Both are already in
# `Cargo.lock` at these versions (Tauri depends on them), so neither adds a
# package to the build.
serde_json = "1"
getrandom = "0.3"
# Nova updating itself from its own GitHub releases, and the only thing in the
# binary that reaches the network. The updater is Tauri's own: it fetches the
# one endpoint compiled into `tauri.conf.json` and verifies every artifact
# against the public key beside it before writing anything, so an unsigned or
# tampered update is refused rather than trusted. `process` is what restarts
# Nova into an installed update; the capability file grants it `restart` alone,
# and it can neither start nor inspect any other process.
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
